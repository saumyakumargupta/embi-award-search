<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Institution Portfolio</title>
<style>
  /* Plain page served by the Spring Boot app; no build step, no external resources. */
  :root {
    --bg: #f5f6f4; --surface: #ffffff; --ink: #18211d; --muted: #5a6660; --line: #dbe1dd;
    --accent: #0d6b5a; --accent-ink: #ffffff; --accent-soft: #e1f0eb;
    --ok: #1d7642; --ok-soft: #e2f3e9; --warn: #8f5c00; --warn-soft: #fbefd6;
    --bad: #b02a22; --bad-soft: #fbe4e2; --neutral: #55606a; --neutral-soft: #e9edf0;
    --demo: #6b3fa0; --demo-soft: #efe7f8;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
    --sans: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111614; --surface: #19201d; --ink: #e2eae6; --muted: #9ba8a2; --line: #2b3531;
      --accent: #4fc2a7; --accent-ink: #0c1512; --accent-soft: #173029;
      --ok: #6fd39a; --ok-soft: #173325; --warn: #f0bf5a; --warn-soft: #33290f;
      --bad: #ff8a80; --bad-soft: #3a1c1a; --neutral: #b4bec6; --neutral-soft: #252c31;
      --demo: #c9a5f2; --demo-soft: #2c2140;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 28px 16px 64px; }
  header h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--muted); }
  a { color: var(--accent); }
  code { font-family: var(--mono); font-size: .9em; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-top: 20px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  form { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 10px; align-items: end; }
  @media (max-width: 680px) { form { grid-template-columns: 1fr 1fr; } form .grow { grid-column: 1 / -1; } form button[type=submit] { grid-column: 1 / -1; } }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; min-width: 0; }
  input:focus, select:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[type=submit] { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 7px; padding: 10px 18px; cursor: pointer; }
  button[type=submit]:disabled { opacity: .6; cursor: wait; }
  .examples { margin-top: 12px; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .examples button { font: inherit; font-size: 13px; border: 1px dashed var(--line); background: transparent; color: var(--ink); padding: 3px 10px; border-radius: 999px; cursor: pointer; }
  .examples button:hover { border-color: var(--accent); color: var(--accent); }

  .status { margin-top: 18px; color: var(--muted); }
  .error { margin-top: 18px; border-radius: 10px; padding: 14px 16px; background: var(--bad-soft); color: var(--bad); }
  .error b { display: block; }

  .summary { display: grid; gap: 10px; }
  .summary h2 { margin: 0; font-size: 20px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 14px; }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; background: var(--neutral-soft); color: var(--neutral); }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.demo { background: var(--demo-soft); color: var(--demo); }
  details.notes { font-size: 14px; color: var(--muted); }
  details.notes summary { cursor: pointer; color: var(--ink); }
  details.notes ul { margin: 8px 0 0; padding-left: 20px; }
  .rawlink { font-size: 13px; }

  .grant { border-top: 1px solid var(--line); padding: 16px 0 4px; display: grid; gap: 8px; }
  .grant:first-of-type { border-top: 0; }
  .grant-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  .rank { font-family: var(--mono); color: var(--muted); font-size: 13px; }
  .gid { font-family: var(--mono); font-weight: 600; }
  .gtitle { margin: 0; font-size: 16px; font-weight: 600; }
  .meta { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .meta b { color: var(--ink); font-weight: 600; }
  .lookup { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
  .papers { list-style: none; margin: 4px 0 8px; padding: 0; display: grid; gap: 8px; }
  .paper { background: var(--bg); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; }
  .paper a.ptitle { color: var(--ink); text-decoration: none; font-weight: 500; }
  .paper a.ptitle:hover { color: var(--accent); text-decoration: underline; }
  .pmeta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .collab { font-size: 13px; color: var(--muted); }
  footer { margin-top: 32px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Institution Portfolio</h1>
    <p>Find research grants from the Europe PMC Grants API and the papers that credit them.</p>
  </header>

  <section class="panel" aria-label="Search">
    <div class="tabs" role="tablist">
      <button class="tab" type="button" role="tab" id="tab-uni" aria-selected="true">University</button>
      <button class="tab" type="button" role="tab" id="tab-grant" aria-selected="false">Grant number</button>
    </div>
    <form id="form" novalidate>
      <label class="grow"><span id="q-label">University name</span>
        <input id="q" name="q" autocomplete="off" required placeholder="e.g. University of Manchester">
      </label>
      <label id="limit-wrap">Grants
        <select id="limit">
          <option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option>
          <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
        </select>
      </label>
      <label>Papers per grant
        <select id="per">
          <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option>
        </select>
      </label>
      <button type="submit" id="go">Search</button>
    </form>
    <div class="examples" id="examples"></div>
  </section>

  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div id="error" class="error" hidden></div>
  <section id="results" class="panel" hidden></section>

  <footer>
    This page calls the service's own JSON API: <code>/institution-portfolio</code> and <code>/grant-portfolio</code>.
    Counts describe only the results shown, not a complete record.
  </footer>
</div>

<script>
(function () {
  var mode = 'uni';
  var EXAMPLES = {
    uni: ['University of Manchester', 'University of Cambridge', 'University of Edinburgh', 'University College London'],
    grant: ['MR/L011840/1', '340947', '098051', 'BB/T001984/1']
  };
  var STATUS = {
    PUBLICATIONS_FOUND: ['ok', 'Papers found'],
    UNCERTAIN_ASSOCIATION: ['warn', 'Uncertain links only'],
    NO_PUBLICATIONS_FOUND: ['', 'No papers found'],
    LOOKUP_FAILED: ['bad', 'Lookup failed'],
    NOT_SEARCHED_NO_GRANT_ID: ['', 'Not searched (no grant ID)']
  };
  var ASSOC = {
    CONFIRMED: ['ok', 'Confirmed'],
    UNCERTAIN_FUNDER_UNKNOWN: ['warn', 'Uncertain: no funder given'],
    UNCERTAIN_FUNDER_MISMATCH: ['warn', 'Uncertain: different funder'],
    UNCERTAIN_NO_EXACT_GRANT_ID: ['warn', 'Uncertain: grant ID not exact']
  };

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function chip(kind, text, title) {
    var c = el('span', 'chip' + (kind ? ' ' + kind : ''), text);
    if (title) c.title = title;
    return c;
  }
  function link(href, text, cls) {
    var a = el('a', cls, text);
    a.href = href; a.target = '_blank'; a.rel = 'noopener';
    return a;
  }

  function setMode(next) {
    mode = next;
    $('tab-uni').setAttribute('aria-selected', String(mode === 'uni'));
    $('tab-grant').setAttribute('aria-selected', String(mode === 'grant'));
    $('q-label').textContent = mode === 'uni' ? 'University name' : 'Grant number';
    $('q').placeholder = mode === 'uni' ? 'e.g. University of Manchester' : 'e.g. MR/L011840/1';
    $('limit-wrap').hidden = mode !== 'uni';
    var ex = $('examples');
    ex.textContent = '';
    ex.appendChild(el('span', null, 'Try:'));
    EXAMPLES[mode].forEach(function (v) {
      var b = el('button', null, v);
      b.type = 'button';
      b.addEventListener('click', function () { $('q').value = v; search(); });
      ex.appendChild(b);
    });
  }

  function apiUrl() {
    var q = $('q').value.trim();
    var per = $('per').value;
    if (mode === 'uni') {
      return '/institution-portfolio?institution=' + encodeURIComponent(q) +
        '&limit=' + $('limit').value + '&publicationsPerGrant=' + per;
    }
    return '/grant-portfolio?grantId=' + encodeURIComponent(q) + '&publicationsPerGrant=' + per;
  }

  function search() {
    var q = $('q').value.trim();
    $('error').hidden = true;
    if (!q) {
      showError('Please enter ' + (mode === 'uni' ? 'a university name.' : 'a grant number.'));
      return;
    }
    var url = apiUrl();
    // Keep the search in the address bar so it can be bookmarked or shared.
    var page = '?' + (mode === 'uni' ? 'institution=' : 'grantId=') + encodeURIComponent(q) +
      (mode === 'uni' ? '&limit=' + $('limit').value : '') + '&publicationsPerGrant=' + $('per').value;
    history.replaceState(null, '', page);

    $('go').disabled = true;
    $('results').hidden = true;
    $('status').textContent = 'Searching Europe PMC. This usually takes a few seconds.';
    fetch(url, { headers: { Accept: 'application/json' } })
      .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, status: r.status, body: body }; }); })
      .then(function (res) {
        $('status').textContent = '';
        if (!res.ok) { showProblem(res.status, res.body); return; }
        render(res.body, url);
      })
      .catch(function () {
        $('status').textContent = '';
        showError('Could not reach the service. Is it still running?');
      })
      .finally(function () { $('go').disabled = false; });
  }

  function showError(message, detail) {
    var box = $('error');
    box.textContent = '';
    box.appendChild(el('b', null, message));
    if (detail) box.appendChild(el('span', null, detail));
    box.hidden = false;
  }

  function showProblem(status, p) {
    if (status === 400) return showError('Please check your input.', p.detail || '');
    if (status === 504) return showError('Europe PMC took too long to answer (504).', 'Try again in a minute.');
    if (status === 502) return showError('Europe PMC could not be used (502).',
      (p.detail || '') + ' If the Grants API is down, start the service with PORTFOLIO_GRIST_MODE=demo.');
    showError('Something went wrong (' + status + ').', p.detail || '');
  }

  function render(d, url) {
    var box = $('results');
    box.textContent = '';
    var s = d.summary, gs = d.grantSearch;

    var head = el('div', 'summary');
    var title = d.request.grantId ? 'Grant ' + d.request.grantId : d.request.normalisedInstitution;
    head.appendChild(el('h2', null, title));

    var sources = el('div', 'chips');
    if (gs.source === 'DEMO_FIXTURE') sources.appendChild(chip('demo', 'Demo grants', 'Grants come from the bundled demo file'));
    else sources.appendChild(chip('', 'Live Grants API'));
    var savedCount = d.grants.filter(function (g) { return g.publicationLookup.source === 'SAVED_FIXTURE'; }).length;
    if (savedCount) sources.appendChild(chip('demo', 'Saved paper data for ' + savedCount + ' grant(s)',
      'The live Articles API failed or demo mode is on, so saved results were used'));
    head.appendChild(sources);

    var stats = el('div', 'stats');
    [['Grants shown', s.grantsReturned],
     ['Grant-paper links', s.publicationAssociations],
     ['Confirmed', s.confirmedAssociations],
     ['Uncertain', s.uncertainAssociations],
     ['Distinct papers', s.uniquePublications]].forEach(function (p) {
      var span = el('span'); span.appendChild(el('b', null, String(p[1]))); span.appendChild(document.createTextNode(' ' + p[0]));
      stats.appendChild(span);
    });
    head.appendChild(stats);

    var funders = el('div', 'chips');
    Object.keys(s.grantsByFunder).forEach(function (f) { funders.appendChild(chip('', f + ': ' + s.grantsByFunder[f])); });
    head.appendChild(funders);

    if (d.notes && d.notes.length) {
      var notes = el('details', 'notes');
      notes.appendChild(el('summary', null, 'Notes about this result (' + d.notes.length + ')'));
      var ul = el('ul');
      d.notes.forEach(function (n) { ul.appendChild(el('li', null, n)); });
      notes.appendChild(ul);
      head.appendChild(notes);
    }
    var raw = el('div', 'rawlink');
    raw.appendChild(link(url, 'View the raw JSON'));
    head.appendChild(raw);
    box.appendChild(head);

    if (!d.grants.length) {
      box.appendChild(el('p', 'status', 'No grants to show. See the notes above for why.'));
    }
    d.grants.forEach(function (g) { box.appendChild(renderGrant(g)); });
    box.hidden = false;
  }

  function renderGrant(g) {
    var wrap = el('article', 'grant');
    var head = el('div', 'grant-head');
    head.appendChild(el('span', 'rank', '#' + g.rank));
    head.appendChild(el('span', 'gid', g.grantId || '(no grant ID)'));
    if (g.funder && g.funder.name) head.appendChild(chip('', g.funder.name));
    wrap.appendChild(head);
    if (g.title) wrap.appendChild(el('p', 'gtitle', g.title));

    var meta = el('div', 'meta');
    if (g.institution && g.institution.name) {
      var inst = el('span'); inst.appendChild(el('b', null, g.institution.name));
      if (g.institution.nameMatch && g.institution.nameMatch !== 'EXACT') {
        inst.appendChild(document.createTextNode(' (' + g.institution.nameMatch.toLowerCase() + ' name match)'));
      }
      meta.appendChild(inst);
    }
    if (g.principalInvestigator) meta.appendChild(el('span', null, g.principalInvestigator));
    if (g.startDate) meta.appendChild(el('span', null, g.startDate + ' to ' + (g.endDate || '?')));
    wrap.appendChild(meta);

    var others = (g.allInstitutions || []).filter(function (n) { return !g.institution || n !== g.institution.name; });
    if (others.length) wrap.appendChild(el('div', 'collab', 'Also on this grant: ' + others.join(', ')));

    var pl = g.publicationLookup;
    var st = STATUS[pl.status] || ['', pl.status];
    var lookup = el('div', 'lookup');
    lookup.appendChild(chip(st[0], st[1]));
    if (pl.source === 'SAVED_FIXTURE') lookup.appendChild(chip('demo', 'Saved data', 'From saved Articles API results, not a live call'));
    if (pl.totalHitCount != null) lookup.appendChild(el('span', null, pl.totalHitCount + ' paper(s) mention this grant number'));
    if (pl.error) lookup.appendChild(el('span', null, pl.error));
    wrap.appendChild(lookup);

    if (g.publications && g.publications.length) {
      var list = el('ul', 'papers');
      g.publications.forEach(function (p) {
        var li = el('li', 'paper');
        var href = 'https://europepmc.org/article/' + encodeURIComponent(p.source) + '/' + encodeURIComponent(p.id);
        li.appendChild(link(href, p.title || p.key, 'ptitle'));
        var pm = el('div', 'pmeta');
        var a = ASSOC[p.association] || ['', p.association];
        pm.appendChild(chip(a[0], a[1], p.matchedFunderAgency ? 'Funder on the paper: ' + p.matchedFunderAgency : ''));
        if (p.journal) pm.appendChild(el('span', null, p.journal));
        if (p.pubYear) pm.appendChild(el('span', null, p.pubYear));
        if (p.doi) pm.appendChild(link('https://doi.org/' + p.doi, 'DOI'));
        if (p.matchedFunderAgency && p.association !== 'CONFIRMED') pm.appendChild(el('span', null, 'Paper credits: ' + p.matchedFunderAgency));
        li.appendChild(pm);
        list.appendChild(li);
      });
      wrap.appendChild(list);
    }
    return wrap;
  }

  $('tab-uni').addEventListener('click', function () { setMode('uni'); $('q').value = ''; $('q').focus(); });
  $('tab-grant').addEventListener('click', function () { setMode('grant'); $('q').value = ''; $('q').focus(); });
  $('form').addEventListener('submit', function (e) { e.preventDefault(); search(); });

  // Open a shared link such as /?institution=University%20of%20Leeds or /?grantId=098051
  var params = new URLSearchParams(location.search);
  if (params.get('grantId')) {
    setMode('grant'); $('q').value = params.get('grantId');
  } else {
    setMode('uni'); if (params.get('institution')) $('q').value = params.get('institution');
  }
  if (params.get('limit')) $('limit').value = params.get('limit');
  if (params.get('publicationsPerGrant')) $('per').value = params.get('publicationsPerGrant');
  if ($('q').value) search();
})();
</script>
</body>
</html>
