server:
  port: 8080

spring:
  application:
    name: institution-portfolio
  jackson:
    serialization:
      indent-output: true

management:
  endpoints:
    web:
      exposure:
        include: health

portfolio:
  connect-timeout: 3s
  grist:
    base-url: https://www.ebi.ac.uk/europepmc/GristAPI
    read-timeout: 15s
    # live: call the Grants API. demo: use src/main/resources/demo/grist-demo-records.json instead
    # (for when the Grants API is unavailable). Override with PORTFOLIO_GRIST_MODE=demo.
    mode: live
    # The Grants API returns one record per person on a grant (25 records per page), so one page can hold
    # only a handful of distinct grants. Read up to this many pages to reach the requested number.
    max-pages: 3
  articles:
    base-url: https://www.ebi.ac.uk/europepmc/webservices/rest
    read-timeout: 8s
    # Articles API calls allowed in flight at once, shared by all incoming requests.
    max-concurrent: 4
    # Upper bound on waiting for one request's article lookups, including time queued for a permit.
    lookup-deadline: 20s
    # fallback: call the live Articles API; if a call fails, use saved results from
    #           src/main/resources/demo/articles-fixture.json for that grant (marked SAVED_FIXTURE).
    # live:     never use saved results.   demo: always use saved results.
    # Override with PORTFOLIO_ARTICLES_MODE=live (or demo).
    mode: fallback
